name: 実績レポートの下調べ（読み取り専用）

# どこにも書き込まない。実装前に構造を確認するためだけのもの。

on:
  workflow_dispatch:
    inputs:
      script:
        description: "実行するスクリプト"
        required: true
        default: "inspect_report"
        type: choice
        options: [inspect_report, verify_report_months]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 依存インストール
        # 固まったときにジョブ全体の制限時間を食い潰さないよう、ここで区切る
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -r requirements.txt
          # --with-deps を付けない。運用側のワークフローと揃える。
          # ライブラリは実行環境に入っており、追加で取るのはフォントだけで、
          # そのダウンロードが数分固まることがある。
          playwright install chromium

      - name: 下調べ実行
        env:
          KYUJIN_MASTER_EMAIL: ${{ secrets.KYUJIN_MASTER_EMAIL }}
          KYUJIN_MASTER_PASSWORD: ${{ secrets.KYUJIN_MASTER_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORT_SHEET_ID: ${{ secrets.REPORT_SHEET_ID }}
          REPORT_SHEET_TAB: ${{ secrets.REPORT_SHEET_TAB }}
        run: python src/${{ inputs.script }}.py
