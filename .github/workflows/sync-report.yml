name: 求人ボックス 実績レポート同期

# アカウント別の実績値（表示回数・クリック数・応募数・費用など）を
# スプレッドシートの「アカウント別」タブに記録する。
#
# 月ごと・アカウントごとに1行。同じ組み合わせがあれば対象列だけ上書きし、
# 設定CPA・売上・利益といった手入力の列には触れない。

on:
  schedule:
    # 日本時間 5:10（UTC 20:10）と 15:00（UTC 6:00）の1日2回。
    # GitHubの定時実行は混雑状況で数十分遅れることがある（実測で45〜85分）。
    - cron: "10 20 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "対象月（YYYYMM をカンマ区切り。空なら前月と当月）例: 202604,202605"
        required: false
        type: string

concurrency:
  group: kyujinbox-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 依存インストール
        # 固まったときにジョブ全体の制限時間を食い潰さないよう、ここで区切る。
        # 正常時は長くても3分程度なので8分あれば足りる。
        timeout-minutes: 8
        # aptが応答待ちで止まらないようにする
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -r requirements.txt
          # --with-deps を付けない。
          # 実行環境にはChromiumが必要とするライブラリが最初から入っており、
          # 追加で取りに行くのはフォント21MBだけ。
          # そのダウンロードが数分固まることがあり、取り込みが止まる原因になっていた。
          # 画面を読むだけでフォントは要らないので、ブラウザ本体だけ入れる。
          playwright install chromium

      - name: 実績レポート同期
        env:
          KYUJIN_MASTER_EMAIL: ${{ secrets.KYUJIN_MASTER_EMAIL }}
          KYUJIN_MASTER_PASSWORD: ${{ secrets.KYUJIN_MASTER_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORT_SHEET_ID: ${{ secrets.REPORT_SHEET_ID }}
          REPORT_SHEET_TAB: ${{ secrets.REPORT_SHEET_TAB }}
          REPORT_MONTHS: ${{ inputs.months }}
        run: |
          for attempt in 1 2 3; do
            echo "=== 試行 $attempt/3 ==="
            if python src/report_scraper.py; then
              echo "成功（試行 $attempt 回目）"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && { echo "失敗。30秒待って再試行..."; sleep 30; }
          done
          echo "3回すべて失敗しました"
          exit 1
