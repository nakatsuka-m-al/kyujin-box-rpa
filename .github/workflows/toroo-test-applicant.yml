name: Toroo 応募者登録テスト（架空データ・手動のみ）

# テストのフェーズ1で使う。手動実行のみ。
#
# 架空の応募者を1件だけ Toroo に登録する。
# 求人ボックスにはログインせず、シートにも書かない。
# 本番の応募者同期（sync.yml）とは完全に別で、そちらには一切影響しない。
#
# 既定では下書きだけを出して終わる。実際に送るには confirm に SEND と入れる。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "実際に登録するなら SEND と入力（空なら下書きのみ）"
        required: false
        default: ""
      with_mail:
        description: "メール送信も試す。何か入力すると有効"
        required: false
        default: ""

concurrency:
  group: toroo-test-applicant
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: pip install requests

      - name: 架空の応募者を登録
        env:
          TOROO_CLIENT_ID:            ${{ secrets.TOROO_CLIENT_ID }}
          TOROO_API_SECRET:           ${{ secrets.TOROO_API_SECRET }}
          TOROO_TEST_RECRUITMENT_ID:  ${{ secrets.TOROO_TEST_RECRUITMENT_ID }}
          RESEND_API_KEY:             ${{ secrets.RESEND_API_KEY }}
          APPLICANT_MAIL_TO:          ${{ secrets.APPLICANT_MAIL_TO }}
          APPLICANT_MAIL_FROM:        ${{ secrets.APPLICANT_MAIL_FROM }}
          APPLICANT_MAIL_CLIENT:      ${{ secrets.APPLICANT_MAIL_CLIENT }}
          CONFIRM:                    ${{ inputs.confirm }}
          WITH_MAIL:                  ${{ inputs.with_mail }}
        run: python src/toroo_test_applicant.py
