name: ATS 応募者同期

on:
  schedule:
    # 日本時間 4:40・13:40・18:40（UTC: 19:40・4:40・9:40）
    # UTC 15〜17時台はRunner混雑のため回避、毎時0分も混むため40分にずらす
    - cron: "40 19,4,9 * * *"
  workflow_dispatch:  # 手動実行用

jobs:
  sync-ats:
    runs-on: ubuntu-latest
    # 高速レーン(sync-ats-fast.yml)と同じグループ。同時書き込みによる重複を防ぐ
    concurrency:
      group: ats-sync-ats1
      cancel-in-progress: false
    timeout-minutes: 30  # リトライ3回分の余裕
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: ATSキャッシュ復元
        uses: actions/cache@v4
        with:
          path: seen_ats_applicant_ids.json
          key: seen-ats-ids-${{ github.run_id }}
          restore-keys: |
            seen-ats-ids-

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: ATS同期実行
        env:
          ATS_EMAIL:                   ${{ secrets.ATS_EMAIL }}
          ATS_PASSWORD:                ${{ secrets.ATS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          ATS_SHEET_TAB:               ${{ secrets.ATS_SHEET_TAB }}
        # 一時的なネットワーク／Playwrightタイムアウトに備えて最大3回リトライ
        run: |
          for attempt in 1 2 3; do
            echo "=== 試行 $attempt/3 ==="
            if python src/ats_scraper.py; then
              echo "成功（試行 $attempt 回目）"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "失敗。60秒待って再試行します..."
              sleep 60
            fi
          done
          echo "3回すべて失敗しました"
          exit 1

  sync-ats2:
    runs-on: ubuntu-latest
    concurrency:
      group: ats-sync-ats2
      cancel-in-progress: false
    timeout-minutes: 30  # リトライ3回分の余裕
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: ATS2キャッシュ復元
        uses: actions/cache@v4
        with:
          path: seen_ats2_applicant_ids.json
          key: seen-ats2-ids-${{ github.run_id }}
          restore-keys: |
            seen-ats2-ids-

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: ATS2同期実行
        env:
          ATS_EMAIL:                   ${{ secrets.ATS2_EMAIL }}
          ATS_PASSWORD:                ${{ secrets.ATS2_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          ATS_SHEET_TAB:               ${{ secrets.ATS2_SHEET_TAB }}
          SEEN_IDS_PATH:               seen_ats2_applicant_ids.json
        # 一時的なネットワーク／Playwrightタイムアウトに備えて最大3回リトライ
        run: |
          for attempt in 1 2 3; do
            echo "=== 試行 $attempt/3 ==="
            if python src/ats_scraper.py; then
              echo "成功（試行 $attempt 回目）"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "失敗。60秒待って再試行します..."
              sleep 60
            fi
          done
          echo "3回すべて失敗しました"
          exit 1
