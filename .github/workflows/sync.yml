name: 求人ボックス 応募者同期

on:
  schedule:
    # 6時間ごと（日本時間: 3:30・9:30・15:30・21:30）
    # UTC 15〜17時台はRunner混雑のため回避、毎時0分も混むため30分にずらす
    - cron: "30 18,0,6,12 * * *"
  workflow_dispatch:  # 手動実行用

jobs:
  sync:
    runs-on: ubuntu-latest
    # 定期実行同士が重ならないようにする
    concurrency:
      group: kyujinbox-sweep
      cancel-in-progress: false
    timeout-minutes: 30  # リトライ3回分の余裕
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # seen_applicant_ids.json をキャッシュから復元
      - name: 差分キャッシュ復元
        uses: actions/cache@v4
        with:
          path: seen_applicant_ids.json
          key: seen-ids-${{ github.run_id }}
          restore-keys: |
            seen-ids-

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ブラウザを毎回ダウンロードすると、その分だけ止まる余地が増える
      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 依存インストール
        # 固まったときにジョブ全体の制限時間を食い潰さないよう、ここで区切る。
        # 正常時は長くても3分程度なので8分あれば足りる。
        timeout-minutes: 8
        # aptが応答待ちで止まらないようにする
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -r requirements.txt
          # --with-deps を付けない。
          # 実行環境にはChromiumが必要とするライブラリが最初から入っており、
          # 追加で取りに行くのはフォント21MBだけ。
          # そのダウンロードが数分固まることがあり、取り込みが止まる原因になっていた。
          # 画面を読むだけでフォントは要らないので、ブラウザ本体だけ入れる。
          playwright install chromium

      - name: 同期実行
        env:
          KYUJIN_MASTER_EMAIL:         ${{ secrets.KYUJIN_MASTER_EMAIL }}
          KYUJIN_MASTER_PASSWORD:      ${{ secrets.KYUJIN_MASTER_PASSWORD }}
          KYUJIN_SUB_ACCOUNTS:         ${{ secrets.KYUJIN_SUB_ACCOUNTS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB:            ${{ secrets.GOOGLE_SHEET_TAB }}
        # 一時的なネットワーク／Playwrightタイムアウトに備えて最大3回リトライ
        run: |
          for attempt in 1 2 3; do
            echo "=== 試行 $attempt/3 ==="
            if python src/scraper.py; then
              echo "成功（試行 $attempt 回目）"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "失敗。60秒待って再試行します..."
              sleep 60
            fi
          done
          echo "3回すべて失敗しました"
          exit 1

      - name: スクリーンショットをアップロード（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshot
          path: login_failed.png
          if-no-files-found: ignore
