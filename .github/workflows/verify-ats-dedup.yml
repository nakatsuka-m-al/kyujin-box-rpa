name: ATS重複チェック検証（読み取り専用）

# シートには一切書き込まない。重複チェックが機能するかの確認用。

on:
  workflow_dispatch:
    inputs:
      account:
        description: "検証するアカウント"
        required: true
        default: "ats1"
        type: choice
        options: [ats1, ats2]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Playwright ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 依存インストール
        # 固まったときにジョブ全体の制限時間を食い潰さないよう、ここで区切る
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -r requirements.txt
          # --with-deps を付けない。運用側のワークフローと揃える。
          # ライブラリは実行環境に入っており、追加で取るのはフォントだけで、
          # そのダウンロードが数分固まることがある。
          playwright install chromium

      - name: 検証実行
        env:
          ATS_EMAIL: ${{ inputs.account == 'ats1' && secrets.ATS_EMAIL || secrets.ATS2_EMAIL }}
          ATS_PASSWORD: ${{ inputs.account == 'ats1' && secrets.ATS_PASSWORD || secrets.ATS2_PASSWORD }}
          ATS_SHEET_TAB: ${{ inputs.account == 'ats1' && secrets.ATS_SHEET_TAB || secrets.ATS2_SHEET_TAB }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python src/verify_ats_dedup.py
